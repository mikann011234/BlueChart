
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | BlueChart</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f8f3e9;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        background: #f8f3e9;
      }

      #unity-loading-bar {
        position: absolute;
        z-index: 2;
      }

      #unity-warning {
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 10px;
        right: 10px;
      }

      #unity-footer {
        display: none;
      }

      @media (min-aspect-ratio: 9/16) {
        #unity-canvas {
          height: 100vh;
          width: auto;
          max-width: 100vw;
        }
      }

      @media (max-aspect-ratio: 9/16) {
        #unity-canvas {
          width: 100vw;
          height: auto;
          max-height: 100vh;
        }
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1080" height="2400"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">BlueChart</div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type === "error") {
          div.style.cssText = "background:red;padding:10px;color:white;";
        } else if (type === "warning") {
          div.style.cssText = "background:yellow;padding:10px;color:black;";
          setTimeout(function () {
            if (warningBanner.contains(div)) {
              warningBanner.removeChild(div);
            }
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/app.loader.js";

      var config = {
        dataUrl: buildUrl + "/app.data.br",
        frameworkUrl: buildUrl + "/app.framework.js.br",
        codeUrl: buildUrl + "/app.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "BlueChart",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      var isMobile =
        /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      function resizeCanvas() {
        var aspectRatio = 1080 / 2400;
        var availableWidth = window.innerWidth;
        var availableHeight = window.innerHeight;

        var displayWidth = Math.min(
          availableWidth,
          availableHeight * aspectRatio
        );

        var displayHeight = displayWidth / aspectRatio;

        canvas.style.width = displayWidth + "px";
        canvas.style.height = displayHeight + "px";
      }

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", function () {
        setTimeout(resizeCanvas, 200);
      });

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";

          if (fullscreenButton) {
            fullscreenButton.onclick = function () {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch(function (message) {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
